<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="공부할 때 옆에 띄워 두는 픽셀 도트 어항">
<meta name="theme-color" content="#b7c8b2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="어항">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}body{-webkit-user-select:none;user-select:none;overscroll-behavior:none}input,textarea{-webkit-user-select:text;user-select:text}</style>
<title>어항</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Silkscreen&display=swap">
<style>
/* layout: one full-bleed pixel canvas (room + tank at top-centre), a floating pixel-bordered HUD at the bottom, sheets slide up over it */
:root {
  --ink: #283041;
  --ink-soft: #586176;
  --panel: rgba(250, 252, 255, 0.72);
  --edge: rgba(40, 48, 65, 0.85);
  --chip: rgba(255, 255, 255, 0.78);
  --chip-on: #283041;
  --chip-on-ink: #f4f7ff;
  --accent: #ff8f6b;
  --accent-ink: #2a1610;
  --heart: #ff6f8f;
  --f-ui: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --f-pix: "Silkscreen", ui-monospace, "SFMono-Regular", monospace;
  color-scheme: light;
}
:root.dark {
  --ink: #eef2fb;
  --ink-soft: #a9b2c8;
  --panel: rgba(20, 24, 40, 0.72);
  --edge: rgba(6, 8, 16, 0.9);
  --chip: rgba(255, 255, 255, 0.1);
  --chip-on: #eef2fb;
  --chip-on-ink: #1a1f30;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: #b7c8b2; color: var(--ink); font-family: var(--f-ui); -webkit-tap-highlight-color: transparent; }
#c { position: fixed; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: manipulation; cursor: pointer; }
.num { font-family: var(--f-pix); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.pi { width: 14px; height: 14px; flex: none; }
.pi .p1 { fill: currentColor; } .pi .p2 { fill: currentColor; opacity: 0.55; }
.pi.heart .p1 { fill: var(--heart); }

.pix { box-shadow: 0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge); }

#hud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(18px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.panel { pointer-events: auto; width: min(560px, 100%); box-sizing: border-box; background: var(--panel); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); padding: 14px 16px 14px; display: grid; gap: 10px; }
.who { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; min-width: 0; }
.who b { font-size: 19px; font-weight: 400; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .sp-tag { font-size: 12px; color: var(--ink-soft); margin-left: 8px; }
.who .days { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
.aff { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 6px 10px; }
.aff .lv { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.aff .lv .num { font-size: 13px; }
#bar { height: 8px; background: rgba(127, 140, 160, 0.25); position: relative; }
#bar i { position: absolute; inset: 0 auto 0 0; background: var(--heart); width: 0; transition: width .6s steps(8); }
#next { grid-column: 1 / -1; font-size: 12px; color: var(--ink-soft); }
.btns { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto auto auto auto; gap: 8px; margin-top: 2px; }
.btns .btn { white-space: nowrap; }
button { font: inherit; color: inherit; }
.btn { border: 0; background: var(--chip); color: var(--ink); padding: 10px 12px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-size: 14px; cursor: pointer; box-shadow: 0 -2px 0 0 var(--edge), 0 2px 0 0 var(--edge), -2px 0 0 0 var(--edge), 2px 0 0 0 var(--edge), inset 0 -3px 0 0 rgba(0,0,0,.12); min-height: 42px; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 -2px 0 0 var(--edge), 0 2px 0 0 var(--edge), -2px 0 0 0 var(--edge), 2px 0 0 0 var(--edge); }
.btn:focus-visible, .chip:focus-visible, .sw:focus-visible, .dz:focus-visible, .sp:focus-visible { outline: 2px dashed var(--ink); outline-offset: 5px; }
.btn.icon { padding: 10px 11px; }
#pip.on { background: var(--chip-on); color: var(--chip-on-ink); }
.pipv { position: fixed; left: 0; bottom: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
#feed { background: var(--accent); color: var(--accent-ink); }
#feed:disabled { background: var(--chip); color: var(--ink-soft); cursor: default; }
#feed .num { font-size: 13px; }
#feed.ready { animation: nudge 2.6s steps(2) infinite; }
@keyframes nudge { 0%, 70% { transform: none; } 80% { transform: translateY(-2px); } 90% { transform: none; } }

#toast { position: fixed; left: 50%; top: var(--tank-bottom, 40vh); transform: translate(-50%, 6px); background: var(--panel); color: var(--ink); padding: 9px 14px; font-size: 14px; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; white-space: nowrap; max-width: calc(100vw - 40px); overflow: hidden; text-overflow: ellipsis; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.special { background: var(--accent); color: var(--accent-ink); }

#timerW { position: fixed; left: 50%; top: var(--tank-bottom, 40vh); transform: translateX(-50%); display: flex; align-items: center; gap: 12px; background: var(--panel); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); padding: 6px 8px 6px 12px; color: var(--ink); white-space: nowrap; }
.tw-info { border: 0; background: none; padding: 4px 0; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-soft); cursor: pointer; }
.tw-info .num { font-size: 11px; }
.tw-dot { width: 8px; height: 8px; display: inline-block; background: var(--accent); }
#timerW.paused .tw-dot { background: var(--ink-soft); }
#twTime { font-size: 22px; letter-spacing: 0.04em; color: var(--ink); }
#timerW.paused #twTime { opacity: 0.55; }
.tbtn { border: 0; background: var(--chip); color: var(--ink); width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer; box-shadow: 0 -2px 0 0 var(--edge), 0 2px 0 0 var(--edge), -2px 0 0 0 var(--edge), 2px 0 0 0 var(--edge); }
.tbtn .pi { width: 11px; height: 11px; }
.tbtn:focus-visible, .tw-info:focus-visible { outline: 2px dashed var(--ink); outline-offset: 4px; }
body.has-timer #toast { top: calc(var(--tank-bottom, 40vh) + 56px); }
#snd.on { background: var(--chip-on); color: var(--chip-on-ink); }
#timer.on { background: var(--chip-on); color: var(--chip-on-ink); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stats > div { display: grid; gap: 4px; padding: 10px 12px; background: var(--chip); box-shadow: 0 0 0 2px var(--edge); min-width: 0; }
.stats .big { font-size: 17px; line-height: 1.35; }
.stats span:last-child { font-size: 12px; color: var(--ink-soft); }
.custom { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 14px; }
.custom input { width: 64px; font: inherit; font-family: var(--f-pix); font-size: 15px; padding: 6px 8px; margin: 0 6px; border: 0; background: var(--chip); color: var(--ink); box-shadow: 0 0 0 2px var(--edge); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; height: 120px; }
.wd { display: grid; grid-template-rows: auto 1fr auto; justify-items: center; gap: 4px; min-width: 0; }
.wd > i { align-self: end; width: 100%; max-width: 26px; min-height: 2px; background: var(--ink-soft); opacity: .45; display: block; }
.wd.today > i { background: var(--accent); opacity: 1; }
.wv { font-size: 10px; color: var(--ink-soft); height: 12px; }
.wl { font-size: 12px; color: var(--ink-soft); }
.wd.today .wl { color: var(--ink); }
.log { list-style: none; margin: 0; padding: 0; display: grid; }
.log li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 2px; font-size: 14px; border-bottom: 2px dotted rgba(127,140,160,.35); }
.log li .num { font-size: 12px; color: var(--ink-soft); margin-left: 4px; }
.log li b { font-weight: 400; font-size: 13px; }
.tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.trk { border: 0; background: var(--chip); color: var(--ink); text-align: left; padding: 12px 12px 13px; display: grid; gap: 4px; cursor: pointer; box-shadow: 0 -2px 0 0 var(--edge), 0 2px 0 0 var(--edge), -2px 0 0 0 var(--edge), 2px 0 0 0 var(--edge); min-width: 0; }
.trk:focus-visible { outline: 2px dashed var(--ink); outline-offset: 5px; }
.trk .tn { font-size: 15px; }
.trk .td { font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
.trk.on { background: var(--chip-on); color: var(--chip-on-ink); }
.trk.on .td { color: inherit; opacity: .75; }
.eq { display: flex; gap: 2px; align-items: flex-end; height: 10px; }
.eq i { width: 3px; height: 3px; background: currentColor; opacity: .35; display: block; }
.trk.on .eq i { opacity: 1; animation: eq 1.2s steps(4) infinite; }
.trk.on .eq i:nth-child(2) { animation-delay: -.4s; } .trk.on .eq i:nth-child(3) { animation-delay: -.8s; }
@keyframes eq { 0%, 100% { height: 3px; } 50% { height: 10px; } }
#volIn { width: 100%; accent-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .trk.on .eq i { animation: none; height: 8px; } }
.btn.go { background: var(--accent); color: var(--accent-ink); }
#timerW { z-index: 5; } #hud { z-index: 6; } #scrim { z-index: 19; } .sheet { z-index: 20; } #toast { z-index: 30; }
#scrim { position: fixed; inset: 0; background: rgba(10, 14, 24, 0.28); }
.sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(560px, 100%); max-height: min(78vh, 720px); overflow: auto; background: var(--panel); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(24px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; box-shadow: 0 -3px 0 0 var(--edge); display: grid; gap: 18px; align-content: start; overscroll-behavior: contain; }
:root:not(.dark) .sheet { background: rgba(250, 252, 255, 0.9); }
:root.dark .sheet { background: rgba(20, 24, 40, 0.92); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet h2 { margin: 0; font-size: 20px; font-weight: 400; }
.sheet h3 { margin: 0 0 10px; font-size: 13px; font-weight: 400; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; letter-spacing: 0.04em; }
.sheet section { min-width: 0; }
.sheet .hint { margin: -6px 0 0; font-size: 13px; color: var(--ink-soft); line-height: 1.6; }
.sheet .hint b { color: var(--ink); font-weight: 400; }
.x { border: 0; background: none; color: var(--ink-soft); font-size: 13px; cursor: pointer; padding: 8px; }
.swatches { display: flex; flex-wrap: wrap; gap: 12px; }
.sw { width: 34px; height: 34px; border: 0; background: var(--c); cursor: pointer; box-shadow: 0 -2px 0 0 var(--edge), 0 2px 0 0 var(--edge), -2px 0 0 0 var(--edge), 2px 0 0 0 var(--edge); }
.sw.on { box-shadow: 0 -2px 0 0 var(--edge), 0 2px 0 0 var(--edge), -2px 0 0 0 var(--edge), 2px 0 0 0 var(--edge), inset 0 0 0 3px var(--panel), inset 0 0 0 5px var(--edge); }
.designs { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px; }
.dz { border: 0; padding: 0; background: none; cursor: pointer; display: grid; gap: 6px; text-align: left; position: relative; color: var(--ink); }
.dz canvas { width: 100%; aspect-ratio: 8 / 5; max-width: 100%; image-rendering: pixelated; display: block; box-shadow: 0 -2px 0 0 var(--edge), 0 2px 0 0 var(--edge), -2px 0 0 0 var(--edge), 2px 0 0 0 var(--edge); }
.dz.on canvas { box-shadow: 0 -2px 0 0 var(--edge), 0 2px 0 0 var(--edge), -2px 0 0 0 var(--edge), 2px 0 0 0 var(--edge), 0 0 0 5px var(--accent); }
.dzn { font-size: 13px; }
.dz:disabled { cursor: default; }
.dz:disabled canvas { filter: grayscale(1) brightness(0.8); opacity: 0.45; }
.dz:disabled .dzn { color: var(--ink-soft); }
.dz .lock { position: absolute; top: 8px; left: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { border: 0; background: var(--chip); color: var(--ink); padding: 7px 11px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; box-shadow: 0 -2px 0 0 var(--edge), 0 2px 0 0 var(--edge), -2px 0 0 0 var(--edge), 2px 0 0 0 var(--edge); }
.chip.on { background: var(--chip-on); color: var(--chip-on-ink); }
.chip:disabled { cursor: default; color: var(--ink-soft); opacity: 0.7; }
.chip .dot { width: 10px; height: 10px; background: var(--c); display: inline-block; box-shadow: 0 0 0 1px var(--edge); }
.lock { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; color: var(--ink-soft); background: var(--panel); padding: 2px 4px; }
.lock .pi { width: 9px; height: 9px; }
.menu-body { display: grid; gap: 12px; font-size: 14px; line-height: 1.6; }
.menu-body p { margin: 0; color: var(--ink-soft); }
.menu-body textarea { width: 100%; box-sizing: border-box; min-height: 74px; font-family: var(--f-pix); font-size: 11px; background: var(--chip); color: var(--ink); border: 0; padding: 8px; resize: vertical; word-break: break-all; box-shadow: 0 0 0 2px var(--edge); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.err { color: #d9485f; font-size: 13px; }
.danger { background: #e8697b !important; color: #2a0d12 !important; }
hr.pixel { border: 0; height: 2px; background: repeating-linear-gradient(90deg, var(--edge) 0 4px, transparent 4px 8px); margin: 4px 0; opacity: .5; }

#intro { position: fixed; inset: 0; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(18px + env(safe-area-inset-bottom, 0px)); overflow: auto; }
.intro-card { width: min(520px, 100%); background: var(--panel); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); padding: 20px 18px 18px; display: grid; gap: 14px; box-sizing: border-box; margin-block: 16px; }
.intro-card h1 { margin: 0; font-size: 26px; font-weight: 400; letter-spacing: -0.01em; text-wrap: balance; }
.intro-card .sub { margin: -6px 0 0; color: var(--ink-soft); font-size: 14px; line-height: 1.6; }
#speciesList { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.sp { border: 0; background: var(--chip); padding: 10px 8px 12px; cursor: pointer; display: grid; justify-items: center; gap: 4px; text-align: center; box-shadow: 0 -2px 0 0 var(--edge), 0 2px 0 0 var(--edge), -2px 0 0 0 var(--edge), 2px 0 0 0 var(--edge); color: var(--ink); min-width: 0; }
.sp canvas { width: 88px; height: 80px; max-width: 100%; image-rendering: pixelated; }
.sp.on { background: var(--chip-on); color: var(--chip-on-ink); }
.sp.on .spd { color: inherit; opacity: .8; }
.spn { font-size: 16px; }
.spd { font-size: 11.5px; line-height: 1.5; color: var(--ink-soft); }
.warn { font-size: 12.5px; color: var(--ink-soft); margin: 0; display: flex; gap: 6px; align-items: center; }
#nameInput { font: inherit; font-size: 18px; padding: 10px 12px; border: 0; background: var(--chip); color: var(--ink); box-shadow: 0 0 0 2px var(--edge); width: 100%; box-sizing: border-box; }
#nameInput:focus { outline: 2px dashed var(--ink); outline-offset: 4px; }
.cta { display: flex; justify-content: flex-end; gap: 10px; }
#focusHint { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); font-size: 13px; color: var(--ink); background: var(--panel); padding: 8px 12px; white-space: nowrap; pointer-events: none; }
#focusHint.fade { animation: fadeout 3.2s forwards; }
@keyframes fadeout { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@media (max-width: 600px) {
  .btns { grid-template-columns: minmax(0, 1fr) auto auto auto auto auto auto; gap: 6px; }
  #deco .lbl, #timer .lbl { display: none; }
  #deco, #timer { padding: 9px 10px; }
}
@media (max-width: 420px) {
  .btns { grid-template-columns: 1fr auto auto auto auto auto auto; gap: 6px; }
  #feed #feedIcon, #deco .lbl, #timer .lbl { display: none; }
  #deco, #timer { padding: 9px 8px; }
  .btn { white-space: nowrap; }
  .btn.icon { padding: 9px 8px; }
  .btn { padding: 9px 9px; font-size: 13px; }
  #speciesList { gap: 8px; }
  .sp canvas { width: 66px; height: 60px; }
  .spd { display: none; }
}
@media (max-height: 560px) {
  .aff #next { display: none; }
  .panel { padding: 10px 14px; gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  #feed.ready { animation: none; }
  #bar i { transition: none; }
}
</style>
</head>
<body>
<canvas id="c" aria-label="어항"></canvas>

<div id="hud" hidden>
  <div class="panel pix">
    <div class="who">
      <div style="min-width:0;display:flex;align-items:baseline"><b id="fishName"></b><span class="sp-tag" id="species"></span></div>
      <span class="days">함께한 지 <span class="num" id="days">1</span>일째</span>
    </div>
    <div class="aff">
      <span class="lv"><span id="heartIcon"></span>친밀도 <span class="num" id="aff">0</span></span>
      <div id="bar" aria-hidden="true"><i></i></div>
      <span id="next"></span>
    </div>
    <div class="btns">
      <button class="btn" id="feed" type="button"><span id="feedIcon"></span><span id="feedLabel">먹이 주기</span></button>
      <button class="btn" id="deco" type="button"><span id="decoIcon"></span><span class="lbl">꾸미기</span></button>
      <button class="btn" id="timer" type="button"><span id="timerIcon"></span><span class="lbl">타이머</span></button>
      <button class="btn icon" id="snd" type="button" aria-label="배경음" title="배경음"><span id="sndIcon"></span></button>
      <button class="btn icon" id="focus" type="button" aria-label="집중 모드" title="집중 모드"><span id="focusIcon"></span></button>
      <button class="btn icon" id="pip" type="button" aria-label="PiP로 보기" title="PiP로 보기 (어항만 작은 창으로)"><span id="pipIcon"></span></button>
      <button class="btn icon" id="menu" type="button" aria-label="메뉴" title="메뉴"><span id="menuIcon"></span></button>
    </div>
  </div>
</div>

<div id="toast" class="pix" hidden></div>
<div id="focusHint" class="pix" hidden>화면을 누르면 메뉴가 다시 보여요</div>
<div id="scrim" hidden></div>
<div id="decoSheet" class="sheet" hidden></div>
<div id="timerSheet" class="sheet" hidden></div>
<div id="soundSheet" class="sheet" hidden></div>
<div id="timerW" class="pix" hidden>
  <button id="twOpen" type="button" class="tw-info" aria-label="타이머 설정 열기"><i class="tw-dot"></i><span id="twMode">집중</span></button>
  <span id="twTime" class="num">25:00</span>
  <button id="twPause" type="button" class="tbtn" aria-label="잠깐 멈추기"></button>
  <button id="twStop" type="button" class="tbtn" aria-label="끝내고 기록하기"></button>
</div>
<div id="menuSheet" class="sheet" hidden>
  <div class="sheet-head"><h2>메뉴</h2><button class="x" data-close type="button">닫기</button></div>
  <div class="menu-body">
    <div id="installBox">
      <b style="font-weight:400;font-size:15px">홈 화면에 앱으로 설치</b>
      <p id="installHow"></p>
      <div class="row"><button class="btn go" id="installBtn" type="button" hidden>앱 설치</button></div>
      <hr class="pixel">
    </div>
    <p id="saveState">이 브라우저에 자동으로 저장되고 있어요.</p>
    <p>브라우저 기록을 지우면 저장도 사라져요. 오래 키울 거라면 가끔 저장 코드를 복사해 두세요.</p>
    <div class="row"><button class="btn" id="copyCode" type="button">저장 코드 복사</button></div>
    <textarea id="codeOut" readonly hidden aria-label="저장 코드"></textarea>

// ===== Fish sprite engine (shared by game) =====
const IDX = {O:1,BD:2,BM:3,BL:4,BH:5,FD:6,FM:7,FL:8,BE:9,PW:10,PE:11,EY:12,ES:13,MO:14};

const SPECIES = {

  },

      {kind: 'top', x0: 13, x1: 22, peak: 14.5, h: 6.4, fall: 0.85},
      {kind: 'bot', x0: 11.5, x1: 22.5, peak: 14, h: 7.4, fall: 0.8},
      {kind: 'bot', x0: 21.5, x1: 24, peak: 22.5, h: 4.2, fall: 0.7},
    ],
    eye: {x: 27, y: 12}, pec: {x: 25, y: 15}, gill: 0.42,
    swim: 0.85, tailSx: [0.84, 0.16],
    pal: ['', '#151640', '#2b3796', '#3d5cd2', '#6a8cf0', '#b4c6ff', '#4a37b0', '#7c4ad4', '#b268dc', '#7f98ee', '#ef6f9c', '#1d2470', '#0e0d1c', '#ffffff', '#151a5c'],
  },
  clownfish: {
    label: '흰동가리', desc: '주황 몸에 하얀 띠 세 줄. 작고 부지런해요.',
    w: 30, h: 21, cy: 10,
    body: {cx: 18.5, rx: 9.4, ry: 6.0, taper: 0.42},
    tail: {base: 10.5, spread: 0.8, round: 8.6, fork: 0, maxh: 6.8},
    fins: [
      {kind: 'top', x0: 9.5, x1: 23.5, peak: 20.5, h: 3.6, fall: 0.9, notch: [14.5, 16.8, 0.4]},
      {kind: 'bot', x0: 11.5, x1: 16.5, peak: 13, h: 3.0, fall: 0.6},
      {kind: 'bot', x0: 19, x1: 21.5, peak: 20, h: 2.6, fall: 0.6},
    ],
    eye: {x: 24, y: 8}, pec: {x: 21, y: 11}, gill: 0,
    swim: 1.2, tailSx: [0.78, 0.22],
    pal: ['', '#3a1206', '#d9520e', '#ff7b1c', '#ffa047', '#ffcf8c', '#ef6d14', '#ff8c2e', '#ffae5a', '#ff9840', '#fdf8f0', '#1c1414', '#120c0c', '#ffffff', '#5a1a08'],
    clown: true,
  },
};

const SPRITE_SX = 0.84, SPRITE_SY = 0.72; // 전체 크기 축소 + 위아래를 더 납작하게
function buildSprite(key) {
  const S = SPECIES[key];
  const SX = SPRITE_SX, SY = SPRITE_SY;
  const cy0 = S.cy;
  const w = Math.ceil(S.w * SX) + 1, h = Math.ceil(S.h * SY) + 1, cy = Math.round(cy0 * SY);
  // 출력 픽셀 -> 원본 좌표(연속)
  const X = x => (x + 0.5) / SX, Y = y => cy0 + (y + 0.5 - (cy + 0.5)) / SY + 0.5;
  const {cx: cx0, rx, ry, taper} = S.body;
  const ryAt = dx => dx < 0 ? ry * (1 - taper * Math.pow(Math.min(1, -dx / rx), 1.6)) : ry * (1 - 0.14 * Math.pow(Math.min(1, dx / rx), 2.2));
  const inBody = (x, y) => { const dx = X(x) - cx0, dy = Y(y) - cy0; return (dx / rx) ** 2 + (dy / ryAt(dx)) ** 2 <= 1; };
  const grid = [];
  for (let y = 0; y < h; y++) { grid.push([]); for (let x = 0; x < w; x++) grid[y].push(null); }
  const top = new Array(w).fill(-1), bot = new Array(w).fill(-1);
  for (let x = 0; x < w; x++) for (let y = 0; y < h; y++) if (inBody(x, y)) { if (top[x] < 0) top[x] = y; bot[x] = y; }
  // tail
  const T = S.tail, tailLen = T.round;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const d = T.base - X(x), dy = Y(y) - cy0;
    if (d < -1.2) continue;
    const hh = Math.min(T.maxh, 1.3 + Math.max(0, d) * T.spread);
    if (Math.abs(dy) > hh) continue;
    if (Math.hypot(Math.max(0, d), dy) > T.round) continue;
    if (T.fork && d > T.fork && Math.abs(dy) < (d - T.fork) * 0.62) continue;
    const u = Math.max(0, d) / tailLen;
    const ang = Math.atan2(dy, Math.max(0, d) + 1.5);
    const ray = Math.floor((ang + Math.PI) / 0.3) % 2;
    let c = u < 0.22 ? IDX.FD : (ray ? IDX.FM : IDX.FL);
    if (u > 0.86) c = IDX.FL;
    if (key === 'betta' && u > 0.8) c = IDX.PW;
    if (S.clown && u > 0.8) c = IDX.PE;
    grid[y][x] = {c, k: 2};
  }
  // fins (출력 공간에서 계산)
  for (const f of S.fins) {
    const x0 = f.x0 * SX, x1 = f.x1 * SX, pk = f.peak * SX, fh = f.h * SY * 1.05;
    const notch = f.notch ? [f.notch[0] * SX, f.notch[1] * SX, f.notch[2]] : null;
    for (let x = Math.floor(x0); x <= Math.ceil(x1); x++) {
      if (x < 0 || x >= w || top[x] < 0) continue;
      const xc = x + 0.5;
      if (xc < x0 || xc > x1) continue;
      let p = xc < pk ? (xc - x0) / Math.max(0.5, pk - x0) : 1 - (xc - pk) / Math.max(0.5, x1 - pk) * f.fall;
      if (notch && xc > notch[0] && xc < notch[1]) p *= notch[2];
      const hh = Math.round(fh * Math.max(0, Math.min(1, p)));
      for (let i = 1; i <= hh; i++) {
        const y = f.kind === 'top' ? top[x] - i : bot[x] + i;
        if (y < 0 || y >= h) continue;
        const u = i / Math.max(1, fh);
        let c = u < 0.34 ? IDX.FD : ((x % 2) ? IDX.FM : IDX.FL);
        if (u > 0.85) c = IDX.FL;
        if (key === 'betta' && u > 0.78) c = IDX.PW;
        if (S.clown && i === hh && hh >= 2) c = IDX.PE;
        if (!grid[y][x]) grid[y][x] = {c, k: 3};
      }
    }
  }
  // body
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (!inBody(x, y)) continue;
    const dx = X(x) - cx0, dy = Y(y) - cy0;
    const rel = dy / ryAt(dx);
    let c = IDX.BM;
    if (rel < -0.6) c = IDX.BD;
    else if (rel < -0.2 && dx > -rx * 0.5 && dx < rx * 0.55) c = (rel < -0.36 && dx > -1.5 && dx < 2.5) ? IDX.BH : IDX.BL;
    else if (rel > 0.42) c = IDX.BE;
    if (S.gill && dx >= rx * S.gill && dx < rx * S.gill + 1 / SX && Math.abs(rel) < 0.62) c = IDX.BD;
    if (key === 'betta' && c === IDX.BM && (x * 2 + y) % 5 === 0) c = IDX.BL;
    if (S.clown) {
      const ady = Math.abs(dy);
      const bands = [3.4 - ady * 0.22, -3.0 + (1 - Math.min(1, ady / ry)) * 1.2, -rx + 1.6];
      const ws = [1.15, 1.2, 0.85];
      bands.forEach((b, i) => { const dd = Math.abs(dx - b); if (dd < ws[i]) c = IDX.PW; else if (dd < ws[i] + 0.8) c = IDX.PE; });
    }
    grid[y][x] = {c, k: 1};
  }
  // eye 2x2
  const ex = Math.round(S.eye.x * SX), ey = Math.round(cy + (S.eye.y + 0.5 - cy0) * SY - 0.5);
  [[0, 0, IDX.ES], [1, 0, IDX.EY], [0, 1, IDX.EY], [1, 1, IDX.EY]].forEach(([ox, oy, c]) => { if (grid[ey + oy] && ex + ox < w) grid[ey + oy][ex + ox] = {c, k: 1, eye: 1}; });
  let nose = 0, tip = w;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (grid[y][x]) { nose = Math.max(nose, x); tip = Math.min(tip, x); }
  const mouthY = cy + 1;
  let mouthX = -1;
  for (let x = w - 1; x >= 0; x--) if (grid[mouthY][x] && grid[mouthY][x].k === 1) { mouthX = x; break; }
  if (mouthX >= 0) grid[mouthY][mouthX] = {c: IDX.MO, k: 1, mouth: 1};
  const pixels = [];
  for (const k of [3, 2, 1]) for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const g = grid[y][x]; if (g && g.k === k) pixels.push({x, y, c: g.c, k, eye: !!g.eye, mouth: !!g.mouth});
  }
  const rgb = S.pal.map(hx => hx ? [parseInt(hx.slice(1, 3), 16), parseInt(hx.slice(3, 5), 16), parseInt(hx.slice(5, 7), 16)] : null);
  const pec = {x: Math.round(S.pec.x * SX), y: Math.round(cy + (S.pec.y - cy0) * SY)};
  return {key, S, pixels, nose, tip, cx: Math.round(cx0 * SX), cy, w, h, mouthX, mouthY, rgb, M: 10, tailBase: T.base * SX, pec};
}

const PEC_FRAMES = [
  [[0, 0, 6], [-1, 0, 7], [-2, 0, 8], [-1, 1, 7], [-2, 1, 8], [-3, 1, 8]],
  [[0, 0, 6], [-1, 0, 7], [-1, 1, 8], [-2, 1, 8]],
  [[0, 0, 6], [-1, 1, 7]],
  [[0, 0, 6], [-1, 0, 7], [-1, 1, 8], [-2, 1, 8]],
];

// st: {phase, amp, slope, tailSx, blink, mouthOpen, pec, shimmer, time}
function renderFishGrid(sp, st, out) {
  const M = sp.M, W = sp.w + 4, H = sp.h + 2 * M;
  if (!out.grid || out.grid.length !== W * H) out.grid = new Uint8Array(W * H);
  const g = out.grid; g.fill(0);
  const span = sp.nose - sp.tip;
  const base = sp.tailBase;
  const offAt = x => {
    const t = Math.min(1, Math.max(0, (sp.nose - x) / span));
    return st.amp * t * t * Math.sin(st.phase - t * 5.2) + st.slope * (x - sp.cx);
  };
  const colOff = new Float32Array(sp.w + 1);
  for (let x = 0; x <= sp.w; x++) colOff[x] = offAt(x);
  const sh = st.shimmer ? Math.floor(st.time * 4) : 0;
  for (const p of sp.pixels) {
    let x = p.x;
    if (p.k === 2 && x < base) x = base - (base - x) * st.tailSx;
    const dx = Math.round(x) + 2, dy = p.y + Math.round(colOff[p.x]) + M;
    if (dx < 0 || dx >= W || dy < 0 || dy >= H) continue;
    let c = p.c;
    if (p.eye && st.blink) c = IDX.BD;
    if (p.mouth) c = st.mouthOpen ? 0 : IDX.MO;
    if (st.shimmer && p.k === 1 && c >= 3 && c <= 4) {
      const hsh = ((p.x * 73856093) ^ (p.y * 19349663) ^ (sh * 83492791)) >>> 0;
      if (hsh % 61 === 0) c = IDX.ES;
    }
    if (c) g[dy * W + dx] = c;
  }
  // pectoral
  const P = sp.pec;
  const fr = PEC_FRAMES[Math.floor(st.pec) % 4];
  const po = Math.round(colOff[P.x]);
  for (const [ox, oy, c] of fr) {
    const dx = P.x + ox + 2, dy = P.y + oy + po + M;
    if (dx >= 0 && dx < W && dy >= 0 && dy < H) g[dy * W + dx] = c;
  }
  // outline (4-neighbour)
  const o = out.ol && out.ol.length === W * H ? out.ol : (out.ol = new Uint8Array(W * H));
  o.fill(0);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (g[i]) continue;
    if ((x > 0 && g[i - 1]) || (x < W - 1 && g[i + 1]) || (y > 0 && g[i - W]) || (y < H - 1 && g[i + W])) o[i] = 1;
  }
  for (let i = 0; i < g.length; i++) if (o[i]) g[i] = IDX.O;
  out.W = W; out.H = H;
  return out;
}

if (typeof module !== 'undefined') module.exports = {SPECIES, buildSprite, renderFishGrid};

// ---------- save ----------
function defaultSave() {
  return {v: 1, fish: null, name: '', created: 0, aff: 0, feeds: 0, lastFed: 0,
    set: {bg: 'sage', design: 'solid', sand: 'beige', frame: 'glass', plants: false, pebbles: false, shell: false, bubbler: false, castle: false, coral: false, moss: false, lamp: false, rays: false, shimmer: false, stars: false},
    timer: {run: null},
    sound: {on: false, track: 'night', vol: 0.5, sleep: 0},
    focus: {days: {}, totalMin: 0, sessions: 0, best: 0, recent: []}};
}
let save = defaultSave();
let storageOK = true;
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) { const s = JSON.parse(raw); save = Object.assign(defaultSave(), s); mergeNested(s); }
  } catch (e) { storageOK = false; }

    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, last = 0;
    for (let i = 0; i < n; i++) {

      b0 = 0.99886 * b0 + x * 0.0555179; b1 = 0.99332 * b1 + x * 0.0750759; b2 = 0.969 * b2 + x * 0.153852; b3 = 0.8665 * b3 + x * 0.3104856; b4 = 0.55 * b4 + x * 0.5329522; b5 = -0.7616 * b5 - x * 0.016898;

    if (id === 'night') {
      const n = 1 + Math.floor(Math.random() * 4);
      for (let i = 0; i < n; i++) bubble(out, t + i * (0.06 + Math.random() * 0.1), {f0: 300 + Math.random() * 200, f1: 900 + Math.random() * 700, dur: 0.05 + Math.random() * 0.05, vol: 0.025 + Math.random() * 0.03, pan: Math.random() * 0.8 - 0.4});
      snd.next = t + 1.2 + Math.random() * 3.5;
    } else if (id === 'bubbles') {
      bubble(out, t, {f0: 300 + Math.random() * 200, f1: 820 + Math.random() * 600, dur: 0.035 + Math.random() * 0.04, vol: 0.018 + Math.random() * 0.03, pan: -0.2 + Math.random() * 0.15});
      snd.next = t + (Math.random() < 0.2 ? 0.12 + Math.random() * 0.1 : 0.5 + Math.random() * 1.0);
    } else if (id === 'rain') {
      // 가끔 처마에서 떨어지는 큰 물방울, 나머지는 드문드문 작은 빗방울
      if (Math.random() < 0.2) bubble(out, t, {f0: 900 + Math.random() * 500, f1: 500 + Math.random() * 200, dur: 0.05, vol: 0.02 + Math.random() * 0.015, pan: Math.random() * 1.2 - 0.6});
      else drop(out, t, 0.008 + Math.random() * 0.02, Math.random() * 1.6 - 0.8);
      snd.next = t + 0.6 + Math.random() * 1.6;
    } else if (id === 'crickets') {
      const left = Math.random() < 0.5;
      chirp(out, t, left ? -0.6 : 0.55, left ? 4300 : 4700);
      if (Math.random() < 0.08) bubble(out, t + 0.3, {f0: 320, f1: 950, dur: 0.07, vol: 0.03, pan: 0});
      snd.next = t + 0.45 + Math.random() * 0.6;
    } else if (id === 'deep') {
      bubble(out, t, {f0: 140 + Math.random() * 60, f1: 380 + Math.random() * 120, dur: 0.12 + Math.random() * 0.08, vol: 0.035, pan: Math.random() * 0.6 - 0.3});
      snd.next = t + 4 + Math.random() * 7;
    } else if (id === 'nightbub') {
      // 에어스톤 기포: 흐름이 천천히 세졌다 약해지고, 작은 기포가 2~4개씩 뭉쳐 나옴
      const bus = snd.bus || out, flow = 0.6 + 0.4 * Math.sin(t * 0.21) * Math.sin(t * 0.077 + 1);
      const pan = -0.25 + Math.random() * 0.2;
      const n = 1 + Math.floor(Math.random() * (2 + flow * 2));
      let tt = t;
      for (let i = 0; i < n; i++) {
        const big = Math.random() < 0.15;
        bub(bus, tt, big ? 380 + Math.random() * 200 : 750 + Math.random() * 900, big ? 0.03 : 0.012 + Math.random() * 0.016, (big ? 0.05 : 0.025 + Math.random() * 0.03), pan + Math.random() * 0.1, 1.15 + Math.random() * 0.3);
        tt += 0.025 + Math.random() * 0.07;
      }
      if (Math.random() < 0.35) plip(bus, tt + 0.6 + Math.random() * 0.4, 0.02 + Math.random() * 0.025, pan);
      snd.next = tt + (0.35 + Math.random() * 0.9) / (0.6 + flow);
    } else if (id === 'fire') {
      // 타닥: 짧은 소리 몇 개가 뭉쳐서, 가끔 크게 '탁'
      const n = 1 + Math.floor(Math.random() * 4), pan = Math.random() * 0.5 - 0.25;
      for (let i = 0; i < n; i++) crackle(out, t + i * (0.02 + Math.random() * 0.07), Math.random() < 0.1 ? 0.06 : 0.015 + Math.random() * 0.03, pan);
      snd.next = t + 0.08 + Math.random() * 0.7;
    } else { snd.next = horizon + 10; }
  }
}
function setMasterVol(rampSec) {
  if (!snd.ctx) return;
  const v = snd.playing ? Math.pow(save.sound.vol, 2) * 1.1 : 0;
  const g = snd.master.gain, t = snd.ctx.currentTime;
  g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(v, t + (rampSec || 0.15));
}
function playTrack(id) {
  if (!audioInit()) { toast('이 브라우저에서는 소리를 낼 수 없어요'); return; }
  const c = snd.ctx;
  if (snd.cur) { const old = snd.cur; old.out.gain.setTargetAtTime(0, c.currentTime, 0.4); setTimeout(() => old.nodes.forEach(n => { try { n.stop(); } catch (e) {} }), 2500); }
  const out = c.createGain(); out.gain.value = 0; out.connect(snd.master);
  out.gain.setTargetAtTime(TRACK_GAIN[id] || 1, c.currentTime + 0.1, 0.6);
  snd.cur = {id, out, nodes: TRACK_BUILD[id](out)};
  snd.playing = true; snd.next = c.currentTime + 0.4;
  save.sound.track = id; save.sound.on = true; writeSave();
  setMasterVol(0.6); syncTicker(); updateSoundUI();
}
function stopSound(fromSleep) {
  snd.playing = false; save.sound.on = false; snd.stopAt = 0; writeSave();
  if (snd.ctx) {
    const g = snd.master.gain, t = snd.ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0, t + (fromSleep ? 6 : 0.6));
    const old = snd.cur; snd.cur = null;
    if (old) setTimeout(() => old.nodes.forEach(n => { try { n.stop(); } catch (e) {} }), fromSleep ? 6500 : 1000);
  }
  if (fromSleep) toast('배경음을 천천히 껐어요');
  syncTicker(); updateSoundUI();
}
function updateSoundUI() {
  $('#snd').classList.toggle('on', snd.playing);
  if (!$('#soundSheet').hidden) renderSoundSheet();
}
function renderSoundSheet() {
  const s = save.sound;
  let h = `<div class="sheet-head"><h2>배경음</h2><button class="x" data-close type="button">닫기</button></div>`;
  h += `<p class="hint">이어폰으로 작게 틀어 두면 더 좋아요. 다른 탭에 가 있어도 계속 나와요.</p>`;
  h += `<div class="tracks">` + TRACKS.map(t => `<button type="button" class="trk ${snd.playing && s.track === t.id ? 'on' : ''}" data-trk="${t.id}" aria-pressed="${snd.playing && s.track === t.id}"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="tn">${t.name}</span><span class="td">${t.desc}</span></button>`).join('') + `</div>`;
  h += `<section><h3>소리 크기</h3><input id="volIn" type="range" min="0" max="1" step="0.01" value="${s.vol}" aria-label="소리 크기"></section>`;
  h += `<section><h3>자동으로 끄기</h3><div class="chips">` + SLEEPS.map(o => `<button type="button" class="chip ${s.sleep === o.m ? 'on' : ''}" data-sleep="${o.m}">${o.name}</button>`).join('') + `</div>${snd.stopAt ? `<p class="hint" style="margin:10px 0 0"><span class="num">${fmtClock(Math.max(0, snd.stopAt - Date.now()))}</span> 뒤에 꺼져요</p>` : ''}</section>`;
  h += snd.playing ? `<div class="row"><button type="button" class="btn" id="sndStop">끄기</button></div>` : '';
  const el = $('#soundSheet'), sc = el.scrollTop; el.innerHTML = h; el.scrollTop = sc;
}
document.addEventListener('click', e => {
  const b = e.target.closest('#soundSheet button'); if (!b) return;
  if (b.dataset.trk) {
    if (snd.playing && save.sound.track === b.dataset.trk) stopSound(false);
    else { playTrack(b.dataset.trk); if (save.sound.sleep && !snd.stopAt) snd.stopAt = Date.now() + save.sound.sleep * 60000; }
    renderSoundSheet();
  } else if (b.dataset.sleep != null) {
    save.sound.sleep = +b.dataset.sleep; writeSave();
    snd.stopAt = save.sound.sleep && snd.playing ? Date.now() + save.sound.sleep * 60000 : 0;
    renderSoundSheet();
  } else if (b.id === 'sndStop') { stopSound(false); }
});
document.addEventListener('input', e => { if (e.target.id === 'volIn') { save.sound.vol = +e.target.value; setMasterVol(0.1); } });
document.addEventListener('change', e => { if (e.target.id === 'volIn') writeSave(); });
// 저장된 배경음은 첫 터치 때 다시 켬 (브라우저가 자동재생을 막아서)
function resumeSoundOnce() {
  document.removeEventListener('pointerdown', resumeSoundOnce, true);
  if (save.sound.on && save.sound.track && !snd.playing) { playTrack(save.sound.track); if (save.sound.sleep) snd.stopAt = Date.now() + save.sound.sleep * 60000; }
}
document.addEventListener('pointerdown', resumeSoundOnce, true);
setInterval(() => { if (snd.playing && !document.hidden) audioTick(); if (!$('#soundSheet').hidden && snd.stopAt) renderSoundSheet(); }, 250);

// ---------- boot ----------
function start() {
  loadSave();
  initAmbient();
  layout();
  buildDecor();
  if (save.fish && SPECIES[save.fish]) { makeFish(); $('#hud').hidden = false; updateHud(); }
  else showIntro();
  if (!storageOK) toast('이 화면에서는 저장이 안 될 수 있어요. 메뉴의 저장 코드를 써 주세요');
  requestAnimationFrame(rafLoop);
  if (!(document.pictureInPictureEnabled && HTMLCanvasElement.prototype.captureStream)) $('#pip').hidden = true;
  setInterval(() => { if (save.fish) { updateFeedBtn(); if (save.timer.run) updateTimerUI(); } }, 250);
  updateTimerUI(); syncTicker();
  setInterval(() => { if (save.fish) { writeSave(); updateHud(); } }, 30000);
}
window.addEventListener('resize', () => { layout(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && save.fish) writeSave(); else if (!document.hidden && save.fish) updateHud(); });

$('#toName').addEventListener('click', () => { if (!introSel) return; $('#step1').hidden = true; $('#step2').hidden = false; $('#nameInput').placeholder = {goldfish: '예: 금순이', betta: '예: 보라', clownfish: '예: 니모 말고 모모'}[introSel]; setTimeout(() => $('#nameInput').focus(), 50); });
$('#back').addEventListener('click', () => { $('#step2').hidden = true; $('#step1').hidden = false; });
$('#step2').addEventListener('submit', e => {
  e.preventDefault();
  const n = $('#nameInput').value.trim().slice(0, 10) || {goldfish: '금순이', betta: '보라', clownfish: '모모'}[introSel];
  save = defaultSave(); save.fish = introSel; save.name = n; save.created = Date.now();
  writeSave(); $('#intro').hidden = true; $('#hud').hidden = false;
  makeFish(); updateHud(); buildRoomCache();
  setTimeout(() => toast(`${n}${josa(n)} 어항에 왔어요`, true), 400);
});
$('#feed').addEventListener('click', feed);
$('#deco').addEventListener('click', () => { renderDeco(); openSheet('#decoSheet'); });
$('#menu').addEventListener('click', () => { $('#saveState').textContent = storageOK ? '이 브라우저에 자동으로 저장되고 있어요.' : '지금은 브라우저 저장이 막혀 있어요. 저장 코드를 복사해 두세요.'; $('#codeOut').hidden = true; openSheet('#menuSheet'); });
$('#focus').addEventListener('click', () => setFocus(true));
$('#pip').addEventListener('click', togglePip);
$('#snd').addEventListener('click', () => { renderSoundSheet(); openSheet('#soundSheet'); });
$('#timer').addEventListener('click', () => { renderTimerSheet(); openSheet('#timerSheet'); });
$('#twPause').addEventListener('click', pauseTimer);
$('#twStop').addEventListener('click', stopTimer);
$('#twOpen').addEventListener('click', () => $('#timer').click());
$('#scrim').addEventListener('click', closeSheets);
$('#copyCode').addEventListener('click', () => {
  const code = exportCode(); const ta = $('#codeOut'); ta.value = code; ta.hidden = false;
  const done = () => { $('#copyCode').textContent = '복사했어요'; setTimeout(() => { $('#copyCode').textContent = '저장 코드 복사'; }, 1800); };
  try { navigator.clipboard.writeText(code).then(done, () => { ta.select(); }); } catch (e) { ta.select(); }
});
$('#loadCode').addEventListener('click', () => {
  try { importCode($('#codeIn').value); closeSheets(); toast('불러왔어요', true); }
  catch (e) { $('#loadErr').hidden = false; $('#loadErr').textContent = '코드를 읽지 못했어요. 처음부터 끝까지 그대로 붙여넣었는지 확인해 주세요.'; }
});
$('#resetBtn').addEventListener('click', () => { $('#confirmRow').hidden = false; });
$('#cancelReset').addEventListener('click', () => { $('#confirmRow').hidden = true; });
$('#doReset').addEventListener('click', () => {
  save = defaultSave(); try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  fish = null; pellets = []; closeSheets(); buildSand(); buildRoomCache(); introSel = null;
  $('#step1').hidden = false; $('#step2').hidden = true; $('#toName').disabled = true; showIntro();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (document.body.classList.contains('focus')) setFocus(false); else closeSheets(); } });

// icons into buttons
$('#feedIcon').innerHTML = ICONS.food; $('#decoIcon').innerHTML = ICONS.brush; $('#focusIcon').innerHTML = ICONS.moon; $('#menuIcon').innerHTML = ICONS.dots; $('#pipIcon').innerHTML = ICONS.pip; $('#sndIcon').innerHTML = ICONS.speaker; $('#timerIcon').innerHTML = ICONS.clock; $('#twStop').innerHTML = ICONS.stop; $('#heartIcon').innerHTML = ICONS.heart;
start();
</script>
<script>
(function(){
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')) navigator.serviceWorker.register('sw.js').catch(function(){});
  var box=document.getElementById('installBox'), how=document.getElementById('installHow'), b=document.getElementById('installBtn'), deferred=null;
  var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(standalone){box.hidden=true;}
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  how.textContent=ios?'사파리 아래쪽 공유 버튼을 누르고 "홈 화면에 추가"를 골라요. 그러면 앱처럼 전체 화면으로 열리고, 인터넷 없이도 실행돼요.':'크롬이나 엣지 메뉴(⋮)에서 "앱 설치" 또는 "홈 화면에 추가"를 눌러요. 아래 버튼이 보이면 바로 설치할 수 있어요.';
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;b.hidden=false;});
  b.addEventListener('click',function(){ if(!deferred) return; deferred.prompt(); deferred.userChoice.finally(function(){deferred=null;b.hidden=true;}); });
  window.addEventListener('appinstalled',function(){box.hidden=true;});
  // 상태바 색을 방 배경에 맞춤
  setInterval(function(){var m=document.querySelector('meta[name=theme-color]');var c=getComputedStyle(document.body).backgroundColor;if(m&&m.content!==c)m.content=c;},2000);
})();
